[package]
name = "weather"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2"
eframe = "0.28"
egui_extras = { version = "0.28", features = ["image"] }
chrono = "0.4"